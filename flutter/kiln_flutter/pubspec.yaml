name: kiln_flutter
description: "On-device AI runtime for Flutter on Android: chat, thinking, decision, embedding and speech-to-text models (GGUF, Whisper, Parakeet), with honest stats about what actually ran."
version: 0.4.0
repository: https://github.com/RaihanulHaque/kiln
issue_tracker: https://github.com/RaihanulHaque/kiln/issues
topics: [llm, on-device, llama-cpp, ffi, android]
homepage: https://github.com/RaihanulHaque/kiln

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      # iOS is in progress and deliberately not declared: it has not been re-run since v0.1.0.
      # To work on it from a clone, add back `ios: {ffiPlugin: true}` and run scripts/build_ios.sh.

