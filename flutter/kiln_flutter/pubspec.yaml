name: kiln_flutter
description: "On-device LLM runtime for Flutter. Honest about what it runs on."
version: 0.1.0
repository: https://github.com/RaihanulHaque/kiln
issue_tracker: https://github.com/RaihanulHaque/kiln/issues
topics: [llm, on-device, llama-cpp, ffi, android]
homepage:

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

